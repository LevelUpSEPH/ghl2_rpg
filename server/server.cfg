// HL2:RPG server settings. Upload to garrysmod/cfg/server.cfg on the host.
// Values marked CHANGE ME must be filled in before starting the server.

hostname "Half-Life 2 Co-op Campaign | RPG, Levels, Suits, Pets"   // name in the server browser (max 63 characters)
sv_password ""                               // empty = public; set one for a private server
rcon_password "CHANGE_ME_TO_A_LONG_PASSWORD" // CHANGE ME: remote console password (keep it secret)
// Steam login token (GSLT, keeps the server ranked in the browser): not here, it has to be on the command line.
// Put it in /home/gmod/gslt.txt and run setup.sh again.

sv_lan 0
sv_region 3            // 0 US east, 1 US west, 2 South America, 3 Europe, 4 Asia, 5 Australia, 6 Middle East, 7 Africa
sv_allowdownload 1     // players download the addon's icons and suit textures on join
sv_allowupload 0
sv_loadingurl ""

// Lambda co-op settings (lambda_<setting>)
lambda_allow_auto_jump 1      // needed for the Bunny Hop upgrade
lambda_friendlyfire 0
lambda_playercollision 0
lambda_limit_default_ammo 1   // Promised Stock raises this limit per player
lambda_checkpoint_respawn 1

// Logging, so problems can be read back from the host's log files
log on
sv_logecho 1
sv_logfile 1
