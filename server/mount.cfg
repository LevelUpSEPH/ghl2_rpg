// Mounts Half-Life 2, Episode One and Episode Two for the server (maps and content).
// Upload to garrysmod/cfg/mount.cfg on the host.
// The paths point at the Source SDK Base 2013 Dedicated Server (SteamCMD app 244310), installed next to the
// GMod server, or a copy of the needed VPKs uploaded there (see README). Change the paths if it lives elsewhere.

"mountcfg"
{
	"hl2"		"/home/container/sdkbase/hl2"
	"episodic"	"/home/container/sdkbase/episodic"
	"ep2"		"/home/container/sdkbase/ep2"
}
